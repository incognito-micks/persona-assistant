name: Deploy Persona Assistant

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-persona-assistant
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # CI federation identity, not the application's generated managed identity.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_CLIENT_APP_ID: ${{ vars.AZURE_CLIENT_APP_ID }}
      ADMIN_USER_OID: ${{ vars.ADMIN_USER_OID }}
      DISABLE_PUBLIC_ACCESS: ${{ vars.DISABLE_PUBLIC_ACCESS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - uses: Azure/setup-azd@v2.4.0

      - name: Install hook dependencies and validate local inputs
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r scripts/requirements.txt
          .venv/bin/python scripts/deploy_preflight.py --validate-local
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Sign in using workload identity federation
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Provision infrastructure
        run: |
          azd config set auth.useAzCliAuth true
          azd provision --no-prompt

      - name: Deploy the same-origin backend and frontend
        run: azd deploy --no-prompt
